<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>High-End Audio Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            bg: '#050505',
            surface: '#0f0f0f',
            surface2: '#1a1a1a',
            accent: '#ffffff',
            muted: '#888888'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050505; color: #fff; overflow: hidden; user-select: none; }
    
    ::-webkit-scrollbar { width: 0px; }
    
    .text-glow { text-shadow: 0 0 40px rgba(255,255,255,0.3); }
    .art-shadow { box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
    
    /* Equalizer Anim */
    .eq-bar {
      width: 2px;
      background-color: #fff;
      animation: eq-bounce 0.8s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { animation-delay: 0.3s; }
    @keyframes eq-bounce {
      0% { transform: scaleY(0.2); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>
<body class="w-screen h-screen flex relative font-sans antialiased text-white bg-bg">

  <!-- Background Ambient Glow -->
  <div id="ambient-bg" class="absolute inset-0 z-0 opacity-20 filter blur-[100px] transition-all duration-1000 bg-cover bg-center" style="background-image: url('assets/starboy.jpg'); transform: scale(1.2);"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-bg/60 via-bg/90 to-bg z-0 pointer-events-none"></div>

  <!-- App Window (Edge to Edge) -->
  <div class="relative z-10 w-full h-full flex flex-col">
    
    <!-- Top Nav / Window Controls -->
    <div class="h-16 flex items-center justify-between px-8 absolute top-0 w-full z-50 pointer-events-none">
      <div class="flex items-center space-x-2 pointer-events-auto">
        <div class="w-3 h-3 rounded-full bg-[#333] hover:bg-[#ff5f56] transition-colors cursor-pointer"></div>
        <div class="w-3 h-3 rounded-full bg-[#333] hover:bg-[#ffbd2e] transition-colors cursor-pointer"></div>
        <div class="w-3 h-3 rounded-full bg-[#333] hover:bg-[#27c93f] transition-colors cursor-pointer"></div>
      </div>
      <div class="flex items-center space-x-6 text-muted pointer-events-auto">
        <button onclick="switchView('playlist')" id="nav-lib" class="text-white font-medium text-xs tracking-[0.2em] uppercase transition-colors">Library</button>
        <button onclick="switchView('now-playing')" id="nav-np" class="hover:text-white font-medium text-xs tracking-[0.2em] uppercase transition-colors">Now Playing</button>
      </div>
    </div>

    <!-- MAIN VIEWS CONTAINER -->
    <div class="flex-1 relative overflow-hidden">
      
      <!-- VIEW: PLAYLIST -->
      <div id="view-playlist" class="absolute inset-0 w-full h-full flex flex-col overflow-y-auto transition-all duration-700 pt-16">
        
        <!-- Header Art Banner -->
        <div class="w-full h-[45vh] relative flex-shrink-0 flex items-end px-12 pb-12">
          <!-- Dark gradient overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-bg via-bg/40 to-transparent pointer-events-none z-10"></div>
          
          <div class="relative z-20 flex items-end space-x-8 w-full max-w-6xl mx-auto">
            <img src="assets/starboy.jpg" class="w-56 h-56 object-cover art-shadow rounded-sm border border-white/5">
            <div class="flex flex-col">
              <p class="text-xs tracking-[0.3em] text-muted uppercase mb-4">Album</p>
              <h1 class="text-7xl font-semibold tracking-tighter text-glow mb-6 leading-none">Starboy</h1>
              <div class="flex items-center space-x-4 text-sm text-muted">
                <span class="text-white font-medium">The Weeknd</span>
                <span>•</span>
                <span>2016</span>
                <span>•</span>
                <span>18 Songs, 1 hr 8 min</span>
              </div>
            </div>
            
            <div class="ml-auto mb-2 flex items-center space-x-6">
              <button onclick="togglePlay()" class="w-16 h-16 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-[0_0_40px_rgba(255,255,255,0.4)]">
                <i id="header-play-icon" class="ph-fill ph-play text-2xl ml-1"></i>
              </button>
              <button class="w-12 h-12 rounded-full border border-white/20 flex items-center justify-center hover:bg-white/10 transition-colors">
                <i class="ph-light ph-heart text-xl text-white"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Tracklist -->
        <div class="w-full max-w-6xl mx-auto px-12 pb-36 z-20">
          <div class="grid grid-cols-[auto_1fr_auto_auto] gap-4 text-xs tracking-widest text-muted uppercase border-b border-white/10 pb-4 mb-4 font-mono">
            <div class="w-8 text-center">#</div>
            <div>Title</div>
            <div class="pr-8">Plays</div>
            <div class="w-12"><i class="ph-light ph-clock text-sm"></i></div>
          </div>
          
          <div id="tracklist-container" class="space-y-1">
            <!-- Dynamic populated via JS -->
          </div>
        </div>
      </div>


      <!-- VIEW: NOW PLAYING -->
      <div id="view-now-playing" class="absolute inset-0 w-full h-full flex items-center justify-center opacity-0 pointer-events-none transition-all duration-700 translate-y-8 scale-95 pt-16">
        
        <div class="w-full max-w-7xl mx-auto flex h-full items-center justify-center px-12 pb-32 gap-32">
          
          <!-- Large Album Art -->
          <div class="w-[500px] h-[500px] relative group flex-shrink-0">
             <div class="absolute inset-0 bg-white/5 blur-[80px] rounded-full scale-90 group-hover:scale-110 transition-transform duration-1000 z-0"></div>
             <img id="np-art" src="assets/starboy.jpg" class="w-full h-full object-cover art-shadow relative z-10 rounded-sm border border-white/5">
          </div>
          
          <!-- Info & Large Lyrics -->
          <div class="flex-1 flex flex-col justify-center max-w-xl">
             <div class="mb-16">
               <h2 id="np-title" class="text-7xl font-semibold tracking-tighter mb-4 text-glow leading-none">Starboy</h2>
               <p id="np-artist" class="text-3xl text-muted font-light">The Weeknd</p>
             </div>
             
             <!-- Abstract Lyrics / Visualizer lines -->
             <div class="space-y-6 text-3xl font-light tracking-wide text-white/20 leading-relaxed">
               <p class="text-white text-glow transition-all duration-500">I'm a motherfuckin' starboy</p>
               <p class="hover:text-white/60 transition-colors cursor-pointer">Look what you've done</p>
               <p class="hover:text-white/60 transition-colors cursor-pointer">I'm a motherfuckin' starboy</p>
             </div>
          </div>
        </div>

      </div>

    </div>

    <!-- GLOBAL BOTTOM PLAYER BAR -->
    <div class="absolute bottom-0 w-full h-28 bg-bg/80 backdrop-blur-3xl border-t border-white/5 z-50 flex items-center px-8 transition-transform transform translate-y-0">
      
      <!-- Left: Current Track Mini Info -->
      <div class="w-1/3 flex items-center space-x-4 cursor-pointer group" onclick="switchView('now-playing')">
        <div class="relative w-14 h-14 overflow-hidden rounded-sm border border-white/5 bg-surface2">
          <img id="bar-art" src="assets/starboy.jpg" class="w-full h-full object-cover group-hover:scale-110 group-hover:opacity-60 transition-all duration-500">
          <!-- Overlay for expanding -->
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white scale-75 group-hover:scale-100 duration-300">
            <i class="ph-light ph-arrows-out-simple text-xl"></i>
          </div>
        </div>
        <div class="flex flex-col">
          <span id="bar-title" class="text-sm font-medium tracking-wide">Starboy</span>
          <span id="bar-artist" class="text-xs text-muted mt-1">The Weeknd</span>
        </div>
        <button class="ml-4 text-muted hover:text-white transition-colors">
          <i class="ph-light ph-heart text-xl"></i>
        </button>
      </div>

      <!-- Center: Controls & Timeline -->
      <div class="w-1/3 flex flex-col items-center">
        <div class="flex items-center space-x-8 mb-3">
          <button class="text-muted hover:text-white transition-colors"><i class="ph-light ph-shuffle text-xl"></i></button>
          <button onclick="prevTrack()" class="text-white/80 hover:text-white transition-colors"><i class="ph-fill ph-skip-back text-2xl"></i></button>
          
          <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.2)]">
            <i id="bar-play-icon" class="ph-fill ph-play text-xl ml-1"></i>
          </button>
          
          <button onclick="nextTrack()" class="text-white/80 hover:text-white transition-colors"><i class="ph-fill ph-skip-forward text-2xl"></i></button>
          <button class="text-muted hover:text-white transition-colors"><i class="ph-light ph-repeat text-xl"></i></button>
        </div>
        
        <div class="w-full flex items-center space-x-4 text-[10px] text-muted font-mono">
          <span>01:14</span>
          <!-- Thin progress line -->
          <div class="flex-1 h-1 bg-white/10 rounded-full overflow-hidden relative cursor-pointer group">
            <div class="absolute top-0 left-0 h-full bg-white w-1/3 group-hover:bg-white/80 transition-colors shadow-[0_0_10px_white]"></div>
          </div>
          <span id="bar-time">03:50</span>
        </div>
      </div>

      <!-- Right: Extra Controls -->
      <div class="w-1/3 flex items-center justify-end space-x-6 text-muted">
        <button class="hover:text-white transition-colors"><i class="ph-light ph-microphone-stage text-xl"></i></button>
        <button class="hover:text-white transition-colors"><i class="ph-light ph-queue text-xl"></i></button>
        <button class="hover:text-white transition-colors"><i class="ph-light ph-speaker-high text-xl"></i></button>
        <div class="w-24 h-1 bg-white/10 rounded-full cursor-pointer relative group">
          <div class="absolute top-0 left-0 h-full bg-white/80 w-2/3 group-hover:bg-white transition-colors"></div>
        </div>
      </div>
      
    </div>

  </div>

  <script>
    const checkImage = (src) => src;

    const tracks = [
      { id: 1, title: 'Starboy', artist: 'The Weeknd', time: '3:50', plays: '2,143,892,102', cover: checkImage('assets/starboy.jpg') },
      { id: 2, title: 'Mountain Sound', artist: 'Of Monsters and Men', time: '3:35', plays: '124,553,991', cover: checkImage('assets/mountain.jpg') },
      { id: 3, title: 'Neon Love', artist: 'Synthwave Dreams', time: '4:12', plays: '8,992,112', cover: checkImage('assets/love_song.jpg') },
      { id: 4, title: 'Melancholy', artist: 'Retro Fade', time: '5:02', plays: '2,114,332', cover: checkImage('assets/hurt_woman.jpg') },
      { id: 5, title: 'Party Monster', artist: 'The Weeknd', time: '4:09', plays: '562,391,012', cover: checkImage('assets/starboy.jpg') },
      { id: 6, title: 'False Alarm', artist: 'The Weeknd', time: '3:40', plays: '312,948,111', cover: checkImage('assets/starboy.jpg') },
    ];

    let state = {
      currentTrack: 0,
      isPlaying: false,
      activeView: 'playlist'
    };

    const DOM = {
      tracklist: document.getElementById('tracklist-container'),
      
      npArt: document.getElementById('np-art'),
      npTitle: document.getElementById('np-title'),
      npArtist: document.getElementById('np-artist'),
      
      barArt: document.getElementById('bar-art'),
      barTitle: document.getElementById('bar-title'),
      barArtist: document.getElementById('bar-artist'),
      barTime: document.getElementById('bar-time'),
      barPlayIcon: document.getElementById('bar-play-icon'),
      headerPlayIcon: document.getElementById('header-play-icon'),
      
      viewPlaylist: document.getElementById('view-playlist'),
      viewNowPlaying: document.getElementById('view-now-playing'),
      
      navLib: document.getElementById('nav-lib'),
      navNp: document.getElementById('nav-np'),
      
      ambientBg: document.getElementById('ambient-bg')
    };

    function init() {
      renderTracklist();
      updateUI();
    }

    function renderTracklist() {
      DOM.tracklist.innerHTML = tracks.map((track, i) => {
        const isActive = i === state.currentTrack;
        return \`
          <div onclick="playTrack(\${i})" class="grid grid-cols-[auto_1fr_auto_auto] gap-4 items-center px-4 py-3 rounded-lg cursor-pointer transition-all duration-300 \${isActive ? 'bg-white/5' : 'hover:bg-white/5'} group">
            <div class="w-6 text-center text-muted group-hover:text-white transition-colors flex justify-center">
              \${isActive && state.isPlaying 
                ? '<div class="flex items-end justify-center space-x-[2px] h-3"><div class="eq-bar h-full"></div><div class="eq-bar h-full"></div><div class="eq-bar h-full"></div></div>'
                : (isActive ? '<span class="text-white text-xs">▶</span>' : \`<span class="text-xs font-mono">\${i + 1}</span>\`)
              }
            </div>
            <div class="flex items-center space-x-4">
              <img src="\${track.cover}" class="w-10 h-10 object-cover rounded-sm border border-white/5 shadow-md">
              <div class="flex flex-col">
                <span class="\${isActive ? 'text-white' : 'text-white/90'} font-medium tracking-wide text-sm">\${track.title}</span>
                <span class="text-xs text-muted mt-0.5">\${track.artist}</span>
              </div>
            </div>
            <div class="pr-8 text-xs text-muted font-mono tracking-wider">\${track.plays}</div>
            <div class="w-12 text-xs text-muted font-mono">\${track.time}</div>
          </div>
        \`;
      }).join('');
    }

    function updateUI() {
      const track = tracks[state.currentTrack];
      
      DOM.npArt.src = track.cover;
      DOM.npTitle.textContent = track.title;
      DOM.npArtist.textContent = track.artist;
      
      DOM.barArt.src = track.cover;
      DOM.barTitle.textContent = track.title;
      DOM.barArtist.textContent = track.artist;
      DOM.barTime.textContent = track.time;
      
      DOM.ambientBg.style.backgroundImage = \`url('\${track.cover}')\`;
      
      if(state.isPlaying) {
        DOM.barPlayIcon.classList.replace('ph-play', 'ph-pause');
        DOM.barPlayIcon.classList.remove('ml-1');
        
        DOM.headerPlayIcon.classList.replace('ph-play', 'ph-pause');
        DOM.headerPlayIcon.classList.remove('ml-1');
      } else {
        DOM.barPlayIcon.classList.replace('ph-pause', 'ph-play');
        DOM.barPlayIcon.classList.add('ml-1');
        
        DOM.headerPlayIcon.classList.replace('ph-pause', 'ph-play');
        DOM.headerPlayIcon.classList.add('ml-1');
      }
      
      renderTracklist();
    }

    function playTrack(index) {
      if(state.currentTrack === index) {
        togglePlay();
      } else {
        state.currentTrack = index;
        state.isPlaying = true;
        updateUI();
      }
    }

    function togglePlay() {
      state.isPlaying = !state.isPlaying;
      updateUI();
    }

    function nextTrack() {
      state.currentTrack = (state.currentTrack + 1) % tracks.length;
      state.isPlaying = true;
      updateUI();
    }

    function prevTrack() {
      state.currentTrack = (state.currentTrack - 1 + tracks.length) % tracks.length;
      state.isPlaying = true;
      updateUI();
    }

    function switchView(viewName) {
      if (state.activeView === viewName) return;
      state.activeView = viewName;
      
      if(viewName === 'playlist') {
        DOM.navLib.classList.replace('text-muted', 'text-white');
        DOM.navNp.classList.replace('text-white', 'text-muted');
        
        DOM.viewPlaylist.style.opacity = '1';
        DOM.viewPlaylist.style.pointerEvents = 'auto';
        DOM.viewPlaylist.style.transform = 'translateY(0) scale(1)';
        
        DOM.viewNowPlaying.style.opacity = '0';
        DOM.viewNowPlaying.style.pointerEvents = 'none';
        DOM.viewNowPlaying.style.transform = 'translateY(32px) scale(0.95)';
      } else {
        DOM.navNp.classList.replace('text-muted', 'text-white');
        DOM.navLib.classList.replace('text-white', 'text-muted');
        
        DOM.viewNowPlaying.style.opacity = '1';
        DOM.viewNowPlaying.style.pointerEvents = 'auto';
        DOM.viewNowPlaying.style.transform = 'translateY(0) scale(1)';
        
        DOM.viewPlaylist.style.opacity = '0';
        DOM.viewPlaylist.style.pointerEvents = 'none';
        DOM.viewPlaylist.style.transform = 'translateY(-32px) scale(0.95)';
      }
    }

    init();

  </script>
</body>
</html>
