# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets — build/darwin/Info.plist carries a
# hand-added NSAppTransportSecurity exception for the loopback media server, so re-apply it after regenerating.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "tangerg"
  productName: "PLANET"
  productIdentifier: "com.tangerg.planet"
  description: "沉浸式桌面音乐播放器"
  copyright: "(c) 2026, tangerg"
  comments: "PLANET — 本地音乐库 + 在线音源的桌面播放器"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - screenshot
      - doc
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:

# Other data
other:
