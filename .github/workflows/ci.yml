name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Run repository verification
        run: make check

  # `frontend/bindings` is generated from the bound Go service but checked in, so
  # the frontend gate needs no Go toolchain. That trade costs a guard: without
  # this job a changed method signature or wire DTO would leave the frontend
  # compiling happily against a contract the backend no longer speaks.
  bindings:
    name: bindings in sync
    runs-on: macos-latest # the generator type-checks the darwin/cgo build of pkg/application
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Derived from go.mod rather than hard-coded: on a beta line the generator
      # and the runtime it generates against have to be the same release.
      - name: Install the Wails CLI pinned by go.mod
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

      - name: Regenerate bindings
        run: wails3 generate bindings -ts -i -clean=true -silent

      - name: Fail if the checked-in bindings drifted
        run: |
          git diff --exit-code -- frontend/bindings || {
            echo "::error file=frontend/bindings::Generated bindings are stale. Run 'make bindings' and commit the result."
            exit 1
          }
